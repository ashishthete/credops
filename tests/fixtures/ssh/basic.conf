# basic fixture
Host web-1
  HostName 10.0.0.5
  User deploy
  Port 2222
  IdentityFile ~/.ssh/id_ed25519
  DynamicForward 1080
  RemoteForward 9000 localhost:3000

Host db-1
  HostName db.internal
  ProxyJump bastion
  LocalForward 5433 localhost:5432

Host bastion
  HostName 52.1.2.3

Host *
  User fallback
  Port 22
