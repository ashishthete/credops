<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2140"/>
      <stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#6b8cff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#6b8cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d9bff"/>
      <stop offset="1" stop-color="#4f6ef0"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a68bff"/>
      <stop offset="1" stop-color="#7a5cf0"/>
    </linearGradient>
    <linearGradient id="card3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fd1a8"/>
      <stop offset="1" stop-color="#2aa585"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- macOS squircle tile (824px inside 1024 canvas) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>
  <!-- deck: three stacked cards (environments) -->
  <g filter="url(#shadow)">
    <rect x="300" y="250" width="424" height="290" rx="44" fill="url(#card3)" opacity="0.9" transform="rotate(-8 512 395)"/>
    <rect x="290" y="300" width="444" height="300" rx="46" fill="url(#card2)" opacity="0.95" transform="rotate(5 512 450)"/>
    <rect x="270" y="360" width="484" height="330" rx="50" fill="url(#card)"/>
  </g>
  <!-- terminal prompt on the front card -->
  <g fill="none" stroke="#0b0d12" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="350,465 425,525 350,585"/>
    <line x1="470" y1="590" x2="590" y2="590"/>
  </g>
  <!-- connection: a live link dot -->
  <circle cx="680" cy="420" r="22" fill="#0b0d12" opacity="0.85"/>
  <circle cx="680" cy="420" r="12" fill="#4fd1a8"/>
  <!-- tunnel line under the deck -->
  <path d="M300 790 H724" stroke="#6b8cff" stroke-opacity="0.55" stroke-width="14" stroke-linecap="round" stroke-dasharray="2 34"/>
  <circle cx="300" cy="790" r="20" fill="#6b8cff"/>
  <circle cx="724" cy="790" r="20" fill="#4fd1a8"/>
</svg>
